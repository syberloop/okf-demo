name: OKF Health

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      OKF_VAULT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mcp-okf CLI
        run: |
          pip install --quiet mcp-okf || {
            echo "mcp-okf not on PyPI yet — installing from repo";
            git clone --depth 1 https://github.com/syberloop/mcp-okf /tmp/mcp-okf
            pip install --quiet /tmp/mcp-okf
          }
      - name: Install hooks
        run: ./scripts/install-hooks.sh
      - name: Run health check
        run: python3 -m cli health --strict
