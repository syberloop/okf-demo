name: OKF Stale

on:
  schedule:
    - cron: "0 6 1 * *" # monthly 1st, 06:00 UTC
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mcp-okf CLI
        run: |
          pip install --quiet mcp-okf || {
            git clone --depth 1 https://github.com/syberloop/mcp-okf /tmp/mcp-okf
            pip install --quiet /tmp/mcp-okf
          }
      - name: Run staleness report
        run: python3 -m cli stale
