name: OKF Review

on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      OKF_VAULT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mcp-okf CLI
        run: |
          pip install --quiet mcp-okf || {
            git clone --depth 1 https://github.com/syberloop/mcp-okf /tmp/mcp-okf
            pip install --quiet /tmp/mcp-okf
          }
      - name: Run review
        run: python3 -m cli review
